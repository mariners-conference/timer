<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161616"/>
      <stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- accent bar (progress) -->
  <rect x="0" y="0" width="1200" height="8" fill="#262626"/>
  <rect x="0" y="0" width="760" height="8" fill="#4589ff"/>

  <!-- label -->
  <text x="100" y="170" font-family="'IBM Plex Sans', 'Noto Sans JP', sans-serif"
        font-size="40" font-weight="600" letter-spacing="6" fill="#8d8d8d">LIGHTNING TALK</text>

  <!-- timer -->
  <text x="96" y="400" font-family="'IBM Plex Sans', 'Noto Sans JP', sans-serif"
        font-size="280" font-weight="600" fill="#f4f4f4" letter-spacing="3"
        style="font-variant-numeric:tabular-nums;font-feature-settings:'tnum'">05:00</text>

  <!-- title -->
  <text x="100" y="510" font-family="'IBM Plex Sans', 'Noto Sans JP', sans-serif"
        font-size="64" font-weight="700" fill="#f4f4f4">LT Timer</text>

  <!-- subtitle -->
  <text x="100" y="565" font-family="'IBM Plex Sans', 'Noto Sans JP', sans-serif"
        font-size="32" font-weight="400" fill="#a8a8a8">発表時間を計測するカウントアップタイマー</text>

  <!-- corner dot -->
  <circle cx="1090" cy="170" r="18" fill="#42be65"/>
</svg>
